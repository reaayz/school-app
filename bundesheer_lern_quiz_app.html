    <!-- APPLICATION LOGIC & STORAGE SYSTEM -->
    <script>
        /**
         * IndexedDB & Storage Handler for Offline persistence
         */
        class StorageManager {
            constructor() {
                this.dbName = 'ÖBH_LernApp_DB';
                this.dbVersion = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);

                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('folders')) {
                            db.createObjectStore('folders', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('cards')) {
                            db.createObjectStore('cards', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('documents')) {
                            db.createObjectStore('documents', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('stats')) {
                            db.createObjectStore('stats', { keyPath: 'id' });
                        }
                    };

                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };

                    request.onerror = (e) => reject('IndexedDB error: ' + e.target.errorCode);
                });
            }

            async getAll(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            }

            async save(storeName, item) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.put(item);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async delete(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.delete(id);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            }
        }

        /**
         * Main App Controller
         */
        class App {
            constructor() {
                this.storage = new StorageManager();
                this.currentTab = 'decks';
                this.folders = [];
                this.cards = [];
                this.documents = [];
                this.stats = { totalLearned: 0, correctAnswers: 0, wrongAnswers: 0 };
                
                // Quiz state
                this.quizQueue = [];
                this.quizIndex = 0;
                this.quizFlipped = false;
                this.quizFilterFolder = 'all';

                // Temporary storage for image uploads
                this.tempCardImage = null;
                this.tempDocFile = null;
            }

            async init() {
                try {
                    await this.storage.init();
                    await this.loadInitialData();
                    this.switchTab('decks');
                } catch (err) {
                    console.error('Initialization failed:', err);
                    this.showToast('Fehler beim Laden der Datenbank', 'error');
                }
            }

            async loadInitialData() {
                this.folders = await this.storage.getAll('folders');
                this.cards = await this.storage.getAll('cards');
                this.documents = await this.storage.getAll('documents');
                const statsData = await this.storage.getAll('stats');
                
                if (statsData.length > 0) {
                    this.stats = statsData[0];
                }

                // Load default preset content if empty for first time user
                if (this.folders.length === 0) {
                    await this.seedPresetData();
                }
            }

            async seedPresetData() {
                const defaultFolder = {
                    id: 'f_dienstgrade',
                    name: 'Dienstgrade & Chargen',
                    category: 'Dienstgrade',
                    description: 'Österreichisches Bundesheer Chargen und Unteroffiziere',
                    createdAt: Date.now()
                };

                const defaultCards = [
                    {
                        id: 'c_1',
                        folderId: 'f_dienstgrade',
                        front: 'Wie heißt der niedrigste Chargen-Dienstgrad beim ÖBH?',
                        back: 'Gefreiter (Gfr) - 1 Silberner Streifen/Stern auf Dienstgradabzeichen.',
                        hint: 'Chargenebene',
                        imageData: null,
                        box: 1,
                        nextReview: Date.now()
                    },
                    {
                        id: 'c_2',
                        folderId: 'f_dienstgrade',
                        front: 'Dienstgrad: 2 Silberne Sterne (gefällt)',
                        back: 'Korporal (Kpl)',
                        hint: 'Chargengruppe',
                        imageData: null,
                        box: 1,
                        nextReview: Date.now()
                    },
                    {
                        id: 'c_3',
                        folderId: 'f_dienstgrade',
                        front: 'Welche Dienstgradgruppe folgt direkt über den Chargen?',
                        back: 'Die Unteroffiziere (Unterwachtmeister, Wachtmeister, etc.)',
                        hint: 'Hierarchie',
                        imageData: null,
                        box: 1,
                        nextReview: Date.now()
                    }
                ];

                await this.storage.save('folders', defaultFolder);
                for (const c of defaultCards) {
                    await this.storage.save('cards', c);
                }

                this.folders = [defaultFolder];
                this.cards = defaultCards;
            }

            switchTab(tab) {
                this.currentTab = tab;
                
                // Active styles on navigation buttons
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('text-army-accent', 'bg-army-800/50');
                    btn.classList.add('text-slate-400');
                });
                const activeNav = document.getElementById(`nav-${tab}`);
                if (activeNav) {
                    activeNav.classList.add('text-army-accent', 'bg-army-800/50');
                    activeNav.classList.remove('text-slate-400');
                }

                const main = document.getElementById('main-content');
                
                switch (tab) {
                    case 'decks':
                        this.renderDecksView(main);
                        break;
                    case 'quiz':
                        this.renderQuizView(main);
                        break;
                    case 'docs':
                        this.renderDocsView(main);
                        break;
                    case 'stats':
                        this.renderStatsView(main);
                        break;
                }
            }

            /* =========================================================================
               DECKS / FOLDER VIEW
               ========================================================================= */
            renderDecksView(container) {
                let html = `
                    <div class="max-w-4xl mx-auto space-y-6">
                        <!-- Header Banner -->
                        <div class="relative overflow-hidden rounded-xl bg-gradient-to-r from-army-900 via-army-800 to-army-900 border border-army-700/60 p-5 shadow-xl">
                            <div class="camouflage-pattern absolute inset-0 pointer-events-none"></div>
                            <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div>
                                    <h2 class="text-xl font-bold text-slate-100 uppercase tracking-wide flex items-center gap-2">
                                        <i class="fa-solid fa-folder-tree text-army-accent"></i> Ordner übersicht
                                    </h2>

            /* =========================================================================
               QUIZ & LEARNING VIEW (Spaced Repetition Flashcards)
               ========================================================================= */
            renderQuizView(container) {
                // Check if quiz needs initiation
                if (this.quizQueue.length === 0) {
                    this.setupQuizQueue();
                }

                if (this.quizQueue.length === 0) {
                    container.innerHTML = `
                        <div class="max-w-md mx-auto text-center py-12 px-4 bg-army-900 border border-army-700 rounded-2xl shadow-xl">
                            <div class="w-16 h-16 bg-army-800 border border-army-600 text-army-highlight rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-100 mb-2">Keine Karten zur Abfrage verfügbar!</h3>
                            <p class="text-xs text-slate-400 mb-6">Erstelle zuerst Karteikarten in deinen Ordnern, um den Abfragemodus zu starten.</p>
                            <button onclick="app.openNewCardModal()" class="px-4 py-2.5 bg-army-500 hover:bg-army-600 font-bold text-xs text-slate-950 rounded-xl shadow">
                                <i class="fa-solid fa-plus mr-1"></i> Karteikarte anlegen
                            </button>
                        </div>
                    `;
                    return;
                }

                const currentCard = this.quizQueue[this.quizIndex];

                let html = `
                    <div class="max-w-md mx-auto space-y-4">
                        <!-- Quiz Header & Progress Bar -->
                        <div class="flex items-center justify-between text-xs font-mono text-slate-400 px-1">

                            <div class="flex items-center gap-2">
                                <select onchange="app.changeQuizFilter(this.value)" class="bg-army-800 border border-army-700 text-army-accent text-xs rounded px-2 py-1 focus:outline-none">
                                    <option value="all">Alle Ordner</option>
                                    ${this.folders.map(f => `<option value="${f.id}" ${this.quizFilterFolder === f.id ? 'selected' : ''}>${this.escapeHtml(f.name)}</option>`).join('')}

                        <!-- Progress Bar Line -->
                        <div class="w-full bg-army-900 border border-army-800 rounded-full h-2 overflow-hidden">
                            <div class="bg-army-accent h-full transition-all duration-300" style="width: ${((this.quizIndex + 1) / this.quizQueue.length) * 100}%"></div>
                        </div>

                        <!-- Flashcard Flip Box -->
                        <div onclick="app.flipQuizCard()" class="perspective-1000 min-h-[320px] cursor-pointer">
                            <div id="quiz-card-inner" class="relative w-full h-full min-h-[320px] rounded-2xl bg-army-900 border-2 border-army-600/80 shadow-2xl transition-transform duration-500 transform-style-3d ${this.quizFlipped ? 'rotate-y-180' : ''}">
                                
                                <!-- Card Front Side -->
                                <div class="absolute inset-0 w-full h-full p-6 flex flex-col justify-between backface-hidden rounded-2xl bg-army-900">
                                    <div class="flex items-center justify-between text-xs text-army-accent border-b border-army-800 pb-2">
                                        <span class="font-mono uppercase"><i class="fa-solid fa-question-circle"></i> FRAGE</span>
                                        <span class="text-[10px] bg-army-800 px-2 py-0.5 rounded text-slate-400">Tippen zum Drehen</span>
                                    </div>
                                    
                                    <div class="my-auto py-4 text-center space-y-4">
                                        <p class="text-base font-semibold text-slate-100 leading-relaxed">${this.escapeHtml(currentCard.front)}</p>
                                        
                                        ${currentCard.imageData ? `
                                            <div class="flex justify-center">
                                                <img src="${currentCard.imageData}" class="max-h-40 max-w-full rounded-lg border border-army-700 object-contain shadow" alt="Grafik">
                                            </div>
                                        ` : ''}

                                        ${currentCard.hint ? `
                                            <p class="text-xs text-army-accent/70 italic font-mono">Hinweis: ${this.escapeHtml(currentCard.hint)}</p>
                                        ` : ''}

                                    </div>

                                    <div class="my-auto py-4 text-center space-y-3">

                        <!-- Quiz Action Controls -->
                        <div class="grid grid-cols-2 gap-3 pt-2">

                                <i class="fa-solid fa-xmark text-lg"></i> Falsch / Nochmals
                            </button>
                            <button onclick="app.answerQuiz(true)" class="py-3 px-4 bg-army-600 hover:bg-army-500 border border-army-400 text-slate-950 font-extrabold text-xs rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition">
                                <i class="fa-solid fa-check text-lg"></i> Gewusst / Richtig
                            </button>
                        </div>
                    </div>
                `;

                container.innerHTML = html;
            }

            setupQuizQueue() {
                if (this.quizFilterFolder && this.quizFilterFolder !== 'all') {
                    this.quizQueue = this.cards.filter(c => c.folderId === this.quizFilterFolder);
                } else {
                    this.quizQueue = [...this.cards];
                }
                // Shuffle cards for testing
                this.quizQueue.sort(() => Math.random() - 0.5);
                this.quizIndex = 0;
                this.quizFlipped = false;
            }

            changeQuizFilter(folderId) {
                this.quizFilterFolder = folderId;
                this.setupQuizQueue();
                this.renderQuizView(document.getElementById('main-content'));
            }

            startQuizForFolder(folderId) {
                this.quizFilterFolder = folderId;
                this.setupQuizQueue();
                this.switchTab('quiz');
            }

            flipQuizCard() {
                this.quizFlipped = !this.quizFlipped;
                const cardInner = document.getElementById('quiz-card-inner');
                if (cardInner) {
                    cardInner.classList.toggle('rotate-y-180', this.quizFlipped);
                }
            }

            async answerQuiz(isCorrect) {
                if (this.quizQueue.length === 0) return;

                const currentCard = this.quizQueue[this.quizIndex];

                // Update Stats
                this.stats.totalLearned = (this.stats.totalLearned || 0) + 1;
                if (isCorrect) {
                    this.stats.correctAnswers = (this.stats.correctAnswers || 0) + 1;
                    currentCard.box = (currentCard.box || 1) + 1;
                    this.showToast('Super! Weiter so!', 'success');
                } else {
                    this.stats.wrongAnswers = (this.stats.wrongAnswers || 0) + 1;
                    currentCard.box = 1;
                    this.showToast('Wiederholung eingeplant.', 'info');
                }

                await this.storage.save('cards', currentCard);
                await this.storage.save('stats', { id: 'main_stats', ...this.stats });

                // Next Card logic
                this.quizIndex++;
                this.quizFlipped = false;

                if (this.quizIndex >= this.quizQueue.length) {
                    // Completed batch
                    this.showToast('Abfrage-Durchgang beendet!', 'success');
                    this.quizQueue = [];
                }

                this.renderQuizView(document.getElementById('main-content'));
            }

            /* =========================================================================
               DOCUMENTS & NOTES VIEW

                                    <button onclick="app.deleteDocument('${doc.id}')" class="text-slate-500 hover:text-red-400 p-1 text-sm transition">

                                    </button>

                                ${doc.content ? `

            /* =========================================================================

               ========================================================================= */

                                </div>

            /* =========================================================================
               MODALS & FORM ACTIONS
               ========================================================================= */
            openNewFolderModal() {
                document.getElementById('form-folder').reset();
                document.getElementById('modal-folder').classList.remove('hidden');
            }

            openNewCardModal(preselectFolderId = null) {
                const select = document.getElementById('card-folder-id');
                select.innerHTML = '';
                
                if (this.folders.length === 0) {
                    this.showToast('Erstelle zuerst einen Ordner!', 'error');
                    this.openNewFolderModal();
                    return;
                }

                this.folders.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.id;
                    opt.textContent = f.name;
                    if (preselectFolderId && f.id === preselectFolderId) opt.selected = true;
                    select.appendChild(opt);
                });

                document.getElementById('form-card').reset();
                this.clearCardImagePreview();
                document.getElementById('modal-card').classList.remove('hidden');
            }

            openNewDocModal() {
                document.getElementById('form-doc').reset();
                this.tempDocFile = null;
                document.getElementById('doc-file-name').textContent = '';
                document.getElementById('modal-doc').classList.remove('hidden');
            }

            closeModal(modalId) {
                document.getElementById(modalId).classList.add('hidden');
            }

            async saveFolder(event) {
                event.preventDefault();
                const name = document.getElementById('folder-name').value.trim();
                const category = document.getElementById('folder-category').value;
                const description = document.getElementById('folder-desc').value.trim();

                const newFolder = {
                    id: 'f_' + Date.now(),
                    name,
                    category,
                    description,
                    createdAt: Date.now()
                };

                await this.storage.save('folders', newFolder);
                this.folders.push(newFolder);
                this.closeModal('modal-folder');
                this.showToast('Ordner erfolgreich erstellt', 'success');
                if (this.currentTab === 'decks') this.renderDecksView(document.getElementById('main-content'));
            }

            async deleteFolder(id) {
                if (confirm('Möchtest du diesen Ordner inklusive aller enthaltenen Karten wirklich löschen?')) {
                    await this.storage.delete('folders', id);
                    this.folders = this.folders.filter(f => f.id !== id);
                    
                    // Delete associated cards
                    const cardsToDelete = this.cards.filter(c => c.folderId === id);
                    for (const card of cardsToDelete) {
                        await this.storage.delete('cards', card.id);
                    }
                    this.cards = this.cards.filter(c => c.folderId !== id);

                    this.showToast('Ordner gelöscht', 'info');
                    if (this.currentTab === 'decks') this.renderDecksView(document.getElementById('main-content'));
                }
            }

            handleCardImageUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    this.tempCardImage = e.target.result;
                    const img = document.getElementById('card-image-preview');
                    img.src = this.tempCardImage;
                    document.getElementById('card-image-preview-container').classList.remove('hidden');
                    document.getElementById('remove-card-img-btn').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }

            clearCardImagePreview() {
                this.tempCardImage = null;
                document.getElementById('card-image-preview').src = '';
                document.getElementById('card-image-preview-container').classList.add('hidden');
                document.getElementById('remove-card-img-btn').classList.add('hidden');
                document.getElementById('card-image-input').value = '';
            }

            async saveCard(event) {
                event.preventDefault();
                const folderId = document.getElementById('card-folder-id').value;
                const front = document.getElementById('card-front').value.trim();
                const back = document.getElementById('card-back').value.trim();
                const hint = document.getElementById('card-hint').value.trim();

                const newCard = {
                    id: 'c_' + Date.now(),
                    folderId,
                    front,
                    back,
                    hint,
                    imageData: this.tempCardImage || null,
                    box: 1,
                    createdAt: Date.now()
                };

                await this.storage.save('cards', newCard);
                this.cards.push(newCard);
                this.closeModal('modal-card');
                this.showToast('Karteikarte gespeichert', 'success');
                if (this.currentTab === 'decks') this.renderDecksView(document.getElementById('main-content'));
            }

            handleDocFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    this.tempDocFile = {
                        data: e.target.result,
                        name: file.name,
                        type: file.type
                    };
                    document.getElementById('doc-file-name').textContent = 'Anhang: ' + file.name;
                };
                reader.readAsDataURL(file);
            }

            async saveDocument(event) {
                event.preventDefault();
                const title = document.getElementById('doc-title').value.trim();
                const category = document.getElementById('doc-category').value;
                const content = document.getElementById('doc-content').value.trim();

                const newDoc = {
                    id: 'd_' + Date.now(),
                    title,
                    category,
                    content,
                    fileData: this.tempDocFile ? this.tempDocFile.data : null,
                    fileName: this.tempDocFile ? this.tempDocFile.name : null,
                    fileType: this.tempDocFile ? this.tempDocFile.type : null,
                    createdAt: Date.now()
                };

                await this.storage.save('documents', newDoc);
                this.documents.push(newDoc);
                this.closeModal('modal-doc');
                this.showToast('Dokument gespeichert', 'success');
                if (this.currentTab === 'docs') this.renderDocsView(document.getElementById('main-content'));
            }

            async deleteDocument(id) {
                if (confirm('Dokument wirklich löschen?')) {
                    await this.storage.delete('documents', id);
                    this.documents = this.documents.filter(d => d.id !== id);
                    this.showToast('Dokument gelöscht', 'info');
                    if (this.currentTab === 'docs') this.renderDocsView(document.getElementById('main-content'));
                }
            }

            /* =========================================================================
               UTILITY FUNCTIONS
               ========================================================================= */
            getCategoryIcon(category) {
                switch (category) {
                    case 'Dienstgrade': return 'fa-solid fa-ranking-star';
                    case 'Waffenkunde': return 'fa-solid fa-crosshair';
                    case 'Exerzierdienst': return 'fa-solid fa-person-military-pointing';
                    case 'Vorschriften': return 'fa-solid fa-book';
                    case 'Erste Hilfe': return 'fa-solid fa-kit-medical';
                    case 'Taktik': return 'fa-solid fa-compass';
                    default: return 'fa-solid fa-folder';
                }
            }

            showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toast-msg');
                const toastIcon = document.getElementById('toast-icon');

                toastMsg.textContent = message;

                if (type === 'success') {
                    toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
                } else if (type === 'error') {
                    toastIcon.className = 'fa-solid fa-triangle-exclamation text-red-400';
                } else {
                    toastIcon.className = 'fa-solid fa-circle-info text-army-accent';
                }

                toast.classList.remove('translate-y-[-150%]', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-[-150%]', 'opacity-0');
                }, 2500);
            }

            escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>"']/g, function(m) {
                    return {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#039;'
                    }[m];
                });
            }
        }

        // Initialize App on Load
        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new App();
            app.init();
        });
    </script>
</body>
</html>
