<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100">
<head>
    <!-- Supabase Bibliothek -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // Supabase Konfiguration
      const SUPABASE_URL = 'https://axhvkrzuwczdkccxxhmo.supabase.co';
      const SUPABASE_KEY = 'sb_publishable__G6SQye1XgItYVtFfqU2Xw_naxxqC7n';
      
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // Daten in die Cloud speichern
      async function saveToCloud(data) {
        try {
          await supabase.from('app_data').upsert({ id: 'user_app_state', content: data });
        } catch (err) {
          console.error('Cloud Sync Fehler beim Speichern:', err);
        }
      }

      // Daten aus der Cloud laden
      async function loadFromCloud() {
        try {
          const { data, error } = await supabase.from('app_data').select('content').eq('id', 'user_app_state').single();
          if (error) return null;
          return data ? data.content : null;
        } catch (err) {
          console.error('Cloud Sync Fehler beim Laden:', err);
          return null;
        }
      }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ÖBH Lern- & Taktikportal</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        army: {
                            900: '#1a2218',
                            800: '#283424',
                            700: '#394934',
                            600: '#4c6145',
                            500: '#5e7955',
                            accent: '#82a373',
                            highlight: '#d4e157',
                            gold: '#c5a059',
                            dark: '#0f140e'
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Courier New', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f140e;
        }
        ::-webkit-scrollbar-thumb {
            background: #394934;
            border-radius: 3px;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .camouflage-pattern {
            background-color: #1a2218;
            background-image: radial-gradient(#283424 20%, transparent 20%), radial-gradient(#394934 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.85;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden bg-army-dark selection:bg-army-accent selection:text-black">

    <!-- Top Header Bar -->
    <header class="bg-army-900 border-b border-army-700/50 px-4 py-3 flex items-center justify-between shadow-lg z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-army-700 border border-army-accent flex items-center justify-center shadow-inner">
                <i class="fa-solid font-bold fa-shield-halved text-army-highlight text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold tracking-wider text-sm uppercase text-slate-100 flex items-center gap-2">
                    ÖBH LERN-DOCK
                    <span class="text-[10px] bg-army-800 text-army-accent border border-army-600/50 px-1.5 py-0.5 rounded tracking-normal">CLOUD & OFFLINE</span>
                </h1>
                <p class="text-[11px] text-army-accent/80 font-mono">BUNDESHEER KNOWLEDGE SYSTEM</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="app.openNewFolderModal()" class="px-2.5 py-1.5 rounded-md bg-army-800 border border-army-600 hover:bg-army-700 text-xs font-medium text-army-accent flex items-center gap-1.5 transition">
                <i class="fa-solid fa-folder-plus"></i> <span class="hidden sm:inline">Ordner</span>
            </button>
            <button onclick="app.openNewCardModal()" class="px-3 py-1.5 rounded-md bg-army-500 hover:bg-army-600 border border-army-400 text-xs font-bold text-slate-950 flex items-center gap-1.5 shadow transition">
                <i class="fa-solid fa-plus"></i> Karte
            </button>
        </div>
    </header>

    <!-- Main Content Dynamic View Area -->
    <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-6 pb-24 relative">
        <!-- Views rendered here dynamically by JS -->
    </main>

    <!-- Bottom Mobile Navigation Bar (iPhone Optimized) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-army-900/95 backdrop-blur-md border-t border-army-700/60 px-2 py-2 z-30 flex justify-around items-center shrink-0">
        <button onclick="app.switchTab('decks')" id="nav-decks" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-army-accent">
            <i class="fa-solid fa-layer-group text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Ordner</span>
        </button>
        <button onclick="app.switchTab('quiz')" id="nav-quiz" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-slate-400 hover:text-army-accent">
            <i class="fa-solid fa-circle-play text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Abfrage</span>
        </button>
        <button onclick="app.switchTab('docs')" id="nav-docs" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-slate-400 hover:text-army-accent">
            <i class="fa-solid fa-book-bookmark text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Dokumente</span>
        </button>
        <button onclick="app.switchTab('stats')" id="nav-stats" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-slate-400 hover:text-army-accent">
            <i class="fa-solid fa-chart-line text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Statistik</span>
        </button>
    </nav>

    <!-- MODAL: CREATE / EDIT FOLDER -->
    <div id="modal-folder" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-army-900 border border-army-600 rounded-xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-army-700/60 pb-3">
                <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-army-accent"></i> Neuer Lern-Ordner
                </h3>
                <button onclick="app.closeModal('modal-folder')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-folder" onsubmit="app.saveFolder(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-army-accent mb-1">Ordnername</label>
                    <input type="text" id="folder-name" required placeholder="z.B. StG77 A1 MOD Technik" class="w-full bg-army-800 border border-army-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-army-accent">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-army-accent mb-1">Kategorie / Fachbereich</label>
                    <select id="folder-category" class="w-full bg-army-800 border border-army-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-army-accent">
                        <option value="Waffenkunde">Waffenkunde & Schießen</option>
                        <option value="Dienstgrade">Dienstgrade & Abzeichen</option>
                        <option value="Exerzierdienst">Exerzierdienst</option>
                        <option value="Vorschriften">Vorschriften & Recht</option>
                        <option value="Erste Hilfe">Sanitätsdienst / Erste Hilfe</option>
                        <option value="Taktik">Taktik & Orientierung</option>
                        <option value="Allgemein">Allgemein / Sonstiges</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-army-accent mb-1">Beschreibung (Optional)</label>
                    <textarea id="folder-desc" rows="2" placeholder="Wichtige Lerninhalte..." class="w-full bg-army-800 border border-army-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-army-accent"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-army-700/60">
                    <button type="button" onclick="app.closeModal('modal-folder')" class="px-4 py-2 rounded-lg bg-army-800 hover:bg-army-700 text-xs font-semibold text-slate-300">Abbrechen</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-army-500 hover:bg-army-600 text-xs font-bold text-slate-950 shadow">Ordner Erstellen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: CREATE / EDIT FLASHCARD -->
    <div id="modal-card" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-army-900 border border-army-600 rounded-xl max-w-lg w-full p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-army-700/60 pb-3">
                <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-square-plus text-army-accent"></i> Karteikarte Erstellen
                </h3>
                <button onclick="app.closeModal('modal-card')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-card" onsubmit="app.saveCard(event)" class="space-y-4">
                <input type="hidden" id="card-id">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-army-accent mb-1">Ziel-Ordner</label>
                    <select id="card-folder-id" required class="w-full bg-army-800 border border-army-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-army-accent">
                        <!-- Dynamisch gefüllt -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-army-accent mb-1">Vorderseite / Frage</label>
                    <textarea id="card-front" required rows="2" placeholder="z.B. Was sind die Hauptteile des StG77 A1 MOD?" class="w-full bg-army-800 border border-army-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-army-accent"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-army-accent mb-1">Rückseite / Antwort</label>
                    <textarea id="card-back" required rows="3" placeholder="z.B. Lauf, Gasdruckeinrichtung, Verschluss, Kolben, Visiereinrichtung, Gehäuse" class="w-full bg-army-800 border border-army-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-army-accent"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-army-accent mb-1">Zusatz-Hinweis / Notiz (Optional)</label>
                    <input type="text" id="card-hint" placeholder="z.B. DVBH VorNr. 2312.05a" class="w-full bg-army-800 border border-army-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-army-accent">
                </div>
                
                <!-- Image Attachment -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-army-accent mb-1">Bild anfügen (Grafik/Abzeichen/Foto)</label>
                    <input type="file" id="card-image-input" accept="image/*" onchange="app.handleCardImageUpload(event)" class="hidden">
                    <div class="flex items-center gap-3">
                        <button type="button" onclick="document.getElementById('card-image-input').click()" class="px-3 py-2 bg-army-800 hover:bg-army-700 border border-army-700 rounded-lg text-xs font-medium text-army-accent flex items-center gap-2">
                            <i class="fa-solid fa-camera"></i> Foto Auswählen
                        </button>
                        <button type="button" id="remove-card-img-btn" onclick="app.clearCardImagePreview()" class="hidden px-2 py-1 bg-red-900/50 hover:bg-red-800 text-red-300 text-xs rounded border border-red-700">
                            Bild entfernen
                        </button>
                    </div>
                    <div id="card-image-preview-container" class="mt-2 hidden">
                        <img id="card-image-preview" src="" alt
