    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://axhvkrzuwczdkccxxhmo.supabase.co';
      const SUPABASE_KEY = 'sb_publishable__G6SQye1XgItYVtFfqU2Xw_naxxqC7n';
      
      let supabase = null;
      try {
        if (window.supabase) {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
      } catch (err) {
        console.error('Supabase Setup Fehler:', err);
      }

      async function saveToCloud(data) {
        if (!supabase) return;
        try {
          await supabase.from('app_data').upsert({ id: 'user_app_state', content: data });
        } catch (err) {
          console.error('Cloud Sync Fehler beim Speichern:', err);
        }
      }

      async function loadFromCloud() {
        if (!supabase) return null;
        try {
          const { data, error } = await supabase.from('app_data').select('content').eq('id', 'user_app_state').single();
          if (error || !data) return null;
          return data.content;
        } catch (err) {
          console.error('Cloud Sync Fehler beim Laden:', err);
          return null;
        }
      }
    </script>
