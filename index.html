<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ÖBH Lern- & Taktikportal</title>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://axhvkrzuwczdkccxxhmo.supabase.co';
      const SUPABASE_KEY = 'sb_publishable__G6SQye1XgItYVtFfqU2Xw_naxxqC7n';
      
      let supabase = null;
      try {
        if (window.supabase) {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
      } catch (err) {
        console.error('Supabase Setup Fehler:', err);
      }

      async function saveToCloud(data) {
        if (!supabase) return;
        try {
          await supabase.from('app_data').upsert({ id: 'user_app_state', content: data });
        } catch (err) {
          console.error('Cloud Sync Fehler beim Speichern:', err);
        }
      }

      async function loadFromCloud() {
        if (!supabase) return null;
        try {
          const res = await supabase.from('app_data').select('content').eq('id', 'user_app_state');
          if (res.error || !res.data || res.data.length === 0) return null;
          return res.data[0].content;
        } catch (err) {
          console.error('Cloud Sync Fehler beim Laden:', err);
          return null;
        }
      }
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f140e; }
        ::-webkit-scrollbar-thumb { background: #394934; border-radius: 3px; }
    </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden bg-slate-950 text-slate-100">

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-lg z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-emerald-900/40 border border-emerald-500/50 flex items-center justify-center">
                <i class="fa-solid fa-shield-halved text-emerald-400 text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold tracking-wider text-sm uppercase text-slate-100 flex items-center gap-2">
                    ÖBH LERN-DOCK
                    <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-1.5 py-0.5 rounded">ONLINE</span>
                </h1>
                <p class="text-[11px] text-slate-400 font-mono">CLOUD SYNC</p>
            </div>
        </div>
        <button onclick="app.openNewFolderModal()" class="px-3 py-1.5 rounded-md bg-emerald-700 hover:bg-emerald-600 text-xs font-bold text-white shadow transition">
            <i class="fa-solid fa-plus mr-1"></i> Neuer Ordner
        </button>
    </header>

    <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-6 pb-24 relative">
        <div class="text-center py-12 text-slate-400 text-sm">Lade Daten aus der Cloud...</div>
    </main>

    <script>
        class App {
            constructor() {
                this.folders = [];
                this.cards = [];
            }

            async init() {
                const cloudData = await loadFromCloud();
                if (cloudData && Array.isArray(cloudData.folders)) {
                    this.folders = cloudData.folders;
                    this.cards = cloudData.cards || [];
                } else {
                    this.folders = [{ id: 'f_stg77', name: 'StG77 A1 MOD Technik', category: 'Waffenkunde', description: 'Technische Daten' }];
                    this.cards = [{ id: 'c_1', folderId: 'f_stg77', front: '6 Hauptteile des StG77 A1 MOD?', back: '1. Lauf\n2. Gasdruckeinrichtung\n3. Verschluss\n4. Kolben\n5. Visiereinrichtung\n6. Gehäuse' }];
                    await this.syncToCloud();
                }
                this.render();
            }

            async syncToCloud() {
                await saveToCloud({ folders: this.folders, cards: this.cards });
            }

            render() {
                const main = document.getElementById('main-content');
                let html = `<div class="max-w-4xl mx-auto space-y-4"><h2 class="text-xl font-bold uppercase tracking-wide">Ordner</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                
                this.folders.forEach(f => {
                    const count = this.cards.filter(c => c.folderId === f.id).length;
                    html += `
                        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex justify-between items-center shadow">
                            <div>
                                <h3 class="font-bold text-base text-slate-100">${this.escapeHtml(f.name)}</h3>
                                <p class="text-xs text-slate-400 mt-0.5">${count} Karteikarten</p>
                            </div>
                            <span class="px-3 py-1 bg-emerald-900/40 border border-emerald-700/50 text-emerald-300 text-xs font-bold rounded-lg">Aktiv</span>
                        </div>
                    `;
                });
                
                container.innerHTML = html + `</div></div>`;
            }

            openNewFolderModal() {
                const name = prompt("Name des neuen Ordners:");
                if (!name) return;
                this.folders.push({ id: 'f_' + Date.now(), name: name, category: 'Allgemein' });
                this.syncToCloud();
                this.render();
            }

            escapeHtml(str) {
                return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }
        }

        const app = new App();
        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
